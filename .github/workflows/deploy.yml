name: Deploy Salon CRM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 60s          # ← connection timeout
          command_timeout: 10m  # ← script execution timeout
          envs: FRONTEND_PORT,BACKEND_PORT,DEPLOY_PATH
          script: |
            # Deployment variables (can be overridden in GitHub Secrets/Vars or remote server .env)
            DEPLOY_DIR="${DEPLOY_PATH:-/docker/billing}"
            export FRONTEND_PORT="${FRONTEND_PORT:-95}"
            export BACKEND_PORT="${BACKEND_PORT:-5012}"

            echo "🚀 Navigating to $DEPLOY_DIR..."
            cd "$DEPLOY_DIR" || { echo "Directory $DEPLOY_DIR not found"; exit 1; }

            echo "📥 Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "⚙️ Checking for .env configuration file..."
            if [ ! -f .env ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            fi

            echo "🐳 Building and launching Docker containers (Frontend: $FRONTEND_PORT, Backend: $BACKEND_PORT)..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment finished successfully! Frontend running on :$FRONTEND_PORT and Backend on :$BACKEND_PORT"
