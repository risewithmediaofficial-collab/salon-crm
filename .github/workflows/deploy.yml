name: Deploy Salon CRM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Build and Publish Docker Images to GitHub Container Registry
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/salon-crm-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/salon-crm-frontend:latest

  # ────────────────────────────────────────────────────────────
  # 2. Deploy to Remote Server via SSH
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 60s          # ← connection timeout
          command_timeout: 10m  # ← script execution timeout
          envs: FRONTEND_PORT,BACKEND_PORT,MONGO_PORT,DEPLOY_PATH
          script: |
            # Deployment variables with configurable defaults
            DEPLOY_DIR="${DEPLOY_PATH:-/docker/billing}"
            export FRONTEND_PORT="${FRONTEND_PORT:-96}"
            export BACKEND_PORT="${BACKEND_PORT:-5012}"
            export MONGO_PORT="${MONGO_PORT:-27028}"

            echo "🚀 Navigating to $DEPLOY_DIR..."
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR" || { echo "Directory $DEPLOY_DIR not found"; exit 1; }

            # If not yet a git repository, clone it; otherwise fetch and pull
            if [ ! -d .git ]; then
              echo "📥 Cloning repository into $DEPLOY_DIR..."
              git clone https://github.com/risewithmediaofficial-collab/salon-crm.git .
            else
              echo "📥 Pulling latest changes from main branch..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Ensure .env exists from template
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env from .env.example..."
              cp .env.example .env
            fi

            # Sync active port configuration into existing .env file
            echo "⚙️ Updating port configuration in .env..."
            grep -q "^FRONTEND_PORT=" .env && sed -i "s/^FRONTEND_PORT=.*/FRONTEND_PORT=$FRONTEND_PORT/" .env || echo "FRONTEND_PORT=$FRONTEND_PORT" >> .env
            grep -q "^BACKEND_PORT=" .env && sed -i "s/^BACKEND_PORT=.*/BACKEND_PORT=$BACKEND_PORT/" .env || echo "BACKEND_PORT=$BACKEND_PORT" >> .env
            grep -q "^MONGO_PORT=" .env && sed -i "s/^MONGO_PORT=.*/MONGO_PORT=$MONGO_PORT/" .env || echo "MONGO_PORT=$MONGO_PORT" >> .env
            grep -q "^RATE_LIMIT_MAX=" .env && sed -i "s/^RATE_LIMIT_MAX=.*/RATE_LIMIT_MAX=5000/" .env || echo "RATE_LIMIT_MAX=5000" >> .env

            echo "🐳 Building and launching Docker containers..."
            echo "   • Frontend: :$FRONTEND_PORT"
            echo "   • Backend:  :$BACKEND_PORT"
            echo "   • MongoDB:  :$MONGO_PORT"

            docker compose build --no-cache backend frontend
            docker compose up -d --force-recreate --remove-orphans

            # Seed database with initial admin, staff, services, and categories
            echo "🌱 Ensuring database is seeded with services and admin credentials..."
            sleep 5
            docker compose exec -T backend node src/config/seed.js || true

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
