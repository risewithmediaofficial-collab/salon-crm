version: '3.8'

services:
  # ────────────────────────────────────────────────────────────
  # 1. Backend Service (Node.js + Express API)
  #    Mapped to Host Port 5012
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/risewithmediaofficial-collab/salon-crm-backend:latest}
    container_name: ${BACKEND_CONTAINER_NAME:-salon-crm-backend}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5012}:${BACKEND_INTERNAL_PORT:-5000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_INTERNAL_PORT:-5000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/salon-crm}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changeme_super_secret_jwt_access_key_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_super_secret_jwt_refresh_key_min_32_chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:95,http://localhost:5173,*}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SALON_NAME: ${SALON_NAME:-Luxe Salon CRM}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-Asia/Kolkata}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@salon.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@Salon2026!}
    depends_on:
      - mongo
    networks:
      - salon-network

  # ────────────────────────────────────────────────────────────
  # 2. Frontend Service (React + Vite SPA served with Nginx)
  #    Mapped to Host Port 95
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SALON_NAME: ${SALON_NAME:-Luxe Salon CRM}
    image: ${FRONTEND_IMAGE:-ghcr.io/risewithmediaofficial-collab/salon-crm-frontend:latest}
    container_name: ${FRONTEND_CONTAINER_NAME:-salon-crm-frontend}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-95}:80"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_PORT: ${BACKEND_INTERNAL_PORT:-5000}
    depends_on:
      - backend
    networks:
      - salon-network

  # ────────────────────────────────────────────────────────────
  # 3. Database Service (MongoDB)
  # ────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: ${MONGO_CONTAINER_NAME:-salon-crm-mongo}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27024}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-salon-crm}
    volumes:
      - mongo-data:/data/db
    networks:
      - salon-network

networks:
  salon-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
